<!DOCTYPE html>
<html>
<head>
  <title>Admin Settings</title>
  <meta charset="utf-8" />
</head>
<body>
  <h2>Superadmin Settings</h2>
  <form method="post" action="{{ url_for('admin_settings') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

    <fieldset>
      <legend>Verify identity</legend>
      <label for="current_password">Current password</label>
      <input id="current_password" name="current_password" type="password" required />
    </fieldset>

    <fieldset>
      <legend>Change username (optional)</legend>
      <label for="new_username">New username</label>
      <input id="new_username" name="new_username" type="text" placeholder="leave blank to keep current" />
    </fieldset>

    <fieldset>
      <legend>Change password (optional)</legend>
      <label for="new_password">New password</label>
      <input id="new_password" name="new_password" type="password" />
      <label for="confirm_password">Confirm new password</label>
      <input id="confirm_password" name="confirm_password" type="password" />
    </fieldset>

    <button type="submit">Save changes</button>

    {% for message in get_flashed_messages() %}
      <p>{{ message }}</p>
    {% endfor %}
  </form>
</body>
<!-- Minimal template; add styling later -->
</html>
